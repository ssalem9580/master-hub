name: Close BW Lead Scope 1.0 production verification

on:
  push:
    branches:
      - release/bw-lead-scope-1.0-production-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/bw-lead-scope-1.0-production-closeout
      - name: Apply closeout
        run: python .github/bw_scope_production_closeout.py
      - name: Remove temporary helpers
        run: rm .github/workflows/bw-lead-scope-production-closeout.yml .github/bw_scope_production_closeout.py
      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close BW-LEAD-SCOPE-1.0 production verification"
          git push origin HEAD:release/bw-lead-scope-1.0-production-closeout
