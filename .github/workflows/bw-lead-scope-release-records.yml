DATE: 2026-10-02
STATUS: OWNER FINALIZED / SOURCE+AUTOMATED+READY-PREVIEW VERIFIED / CANONICAL PRODUCTION PROMOTION BLOCKED
PROJECT: Master Hub

## Purpose
Finalize the Scope workflow **inside the direct BW Lead tool** while preserving `SCOPE-ISOLATION-1.0` as the canonical Device → SubDevice → Scope behavior.

## Owner Acceptance
Explicit Project Owner instruction: `finilize scope within BW Lead tool`, followed by `final`.
Decision: DEC-018.

## Finalized Behavior
The direct BW dashboard and dedicated Scope Templates surface consume the same centralized scope-isolation engine. Existing finalized behavior remains authoritative:
- exact Device → SubDevice hierarchy
- exact Scope filtering by Device/SubDevice
- normalized grouping
- manual template filtering
- compatible BW-lead filtering
- cross-group attachment rejection
- compatible attachment success
- existing templates/imported/reconciled data preserved

## Fix Found During Finalization Review
Before this release, `/scope-templates` injected the centralized isolation script, but direct `/bw-dashboard.html` did not self-load it. PR #15 repaired this activation gap without changing the isolation rules.

## Implementation
- `master-hub-app/public/bw-dashboard.html`: loads `/api/scope-isolation`.
- `master-hub-app/src/app/api/scope-isolation/route.ts`: serves existing `scopeIsolationScript` as JavaScript.
- `master-hub-app/tests/bw-dashboard-scope-isolation.test.ts`: permanent regression that verifies the direct loader and central engine markers.

No scope data migration. No localStorage format change. No Supabase schema/data change. No duplicate isolation engine.

## Verification
- PR #15 source commit: `3e58cd05cc5c401b7599a7bec190366c80585ed1`
- Main merge: `1af17aae26d43309fbf913c6878b0fc52278295b`
- PR CI `36981871706`: install PASS / lint PASS / tests PASS / build PASS
