name: Record BW Lead Scope 1.0 finalization

on:
  push:
    branches:
      - release/bw-lead-scope-1.0

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/bw-lead-scope-1.0
      - name: Apply release records
        run: python .github/bw_scope_release_records.py
      - name: Remove temporary helpers
        run: rm .github/workflows/bw-lead-scope-release-records.yml .github/bw_scope_release_records.py
      - name: Commit release records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record BW-LEAD-SCOPE-1.0 owner finalization"
          git push origin HEAD:release/bw-lead-scope-1.0
