name: Public Source Safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan public application source
        working-directory: master-hub-app
        run: node scripts/check-public-source-secrets.mjs
