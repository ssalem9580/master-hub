name: Patch BW Lead scope isolation

on:
  push:
    branches:
      - fix/bw-lead-scope-finalization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/bw-lead-scope-finalization
      - name: Apply centralized scope-isolation loader
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('master-hub-app/public/bw-dashboard.html')
          html = dashboard.read_text(encoding='utf-8')
          tag = '<script src="/api/scope-isolation"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('bw-dashboard.html missing </body> marker')
              html = html.replace('</body>', tag + '\n</body>')
              dashboard.write_text(html, encoding='utf-8')

          route = Path('master-hub-app/src/app/api/scope-isolation/route.ts')
          route.parent.mkdir(parents=True, exist_ok=True)
          route.write_text('''import { scopeIsolationScript } from "@/lib/scope-isolation-script";\n\nexport function GET() {\n  return new Response(scopeIsolationScript, {\n    headers: {\n      "content-type": "application/javascript; charset=utf-8",\n      "cache-control": "no-store",\n    },\n  });\n}\n''', encoding='utf-8')

          test = Path('master-hub-app/tests/bw-dashboard-scope-isolation.test.ts')
          test.write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\nimport { GET } from "@/app/api/scope-isolation/route";\n\ndescribe("BW Lead direct scope isolation loader", () => {\n  it("loads the centralized isolation engine in the direct BW dashboard", async () => {\n    const html = fs.readFileSync(path.join(process.cwd(), "public", "bw-dashboard.html"), "utf8");\n    expect(html).toContain('<script src="/api/scope-isolation"></script>');\n\n    const response = GET();\n    expect(response.headers.get("content-type")).toContain("application/javascript");\n    const script = await response.text();\n    expect(script).toContain("importedHierarchy");\n    expect(script).toContain("scopeCompatible");\n    expect(script).toContain("cannot be attached");\n  });\n});\n''', encoding='utf-8')
          PY
      - name: Remove temporary patch workflow
        run: rm .github/workflows/bw-scope-finalize-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes needed."
          else
            git commit -m "Load finalized scope isolation inside BW Lead dashboard"
            git push origin HEAD:fix/bw-lead-scope-finalization
          fi
