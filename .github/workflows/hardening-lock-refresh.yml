name: Refresh hardening dependency lock

on:
  push:
    branches:
      - hardening/security-quality-20260930

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/security-quality-20260930
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master-hub-app/package-lock.json
      - name: Refresh patched Next.js lockfile
        working-directory: master-hub-app
        run: npm install next@16.3.8 eslint-config-next@16.3.8 --save-exact --no-audit --no-fund
      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master-hub-app/package.json master-hub-app/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency lock changes needed."
          else
            git commit -m "Refresh Next.js 16.3.8 dependency lock"
            git push origin HEAD:hardening/security-quality-20260930
          fi
